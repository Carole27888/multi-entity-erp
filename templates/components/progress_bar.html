{# with value=0..100 tone(success|warning|danger|info) label #}
<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ value|default:0 }}"{% if label %} aria-label="{{ label }}"{% endif %}>
  <div class="progress__bar{% if tone and tone != 'success' %} progress__bar--{{ tone }}{% endif %}" style="width: {% if value > 100 %}100{% else %}{{ value|default:0 }}{% endif %}%"></div>
</div>
