{# Rendered into #modal-root by HTMX. Use {% include "components/modal.html" with title="…" body_template="…" %} #}
<div class="modal" x-data="{ open: true }" x-show="open" x-cloak @keydown.escape.window="open = false; $nextTick(() => $root.remove())" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal__backdrop" @click="open = false; $nextTick(() => $root.remove())"></div>
  <div class="modal__panel">
    <div class="modal__header">
      <h2 id="modal-title">{{ title }}</h2>
      <button type="button" class="icon-btn" aria-label="Close" @click="open = false; $nextTick(() => $root.remove())">{% include "components/icon.html" with name="x" size=18 %}</button>
    </div>
    {% if body_template %}{% include body_template %}{% endif %}
  </div>
</div>
