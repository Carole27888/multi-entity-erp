<div class="ios-banner" x-data x-show="$store.pwa && $store.pwa.showIOSBanner" x-cloak role="dialog" aria-label="Install {{ PRODUCT_NAME }}">
  <img src="/static/pwa/icon-96.png" alt="" width="44" height="44" style="border-radius: 10px;">
  <div class="flex-1">
    <div class="fw-700">Install {{ PRODUCT_NAME }} on this {{ device|default:"device" }}</div>
    <ol>
      <li>Tap <strong>Share</strong> <svg class="share-glyph" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share icon"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> in Safari</li>
      <li>Choose <strong>Add to Home Screen</strong></li>
      <li>Tap <strong>Add</strong></li>
    </ol>
  </div>
  <button type="button" class="toast__close" style="color: var(--c-text-muted);" aria-label="Dismiss install instructions" @click="$store.pwa.dismissIOS()">
    {% include "components/icon.html" with name="x" size=18 %}
  </button>
</div>
